<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDJXQA4GDoYpeUkeLfglZ34qyj-sGbhtac",
    authDomain: "savdo-f67f0.firebaseapp.com",
    projectId: "savdo-f67f0",
    storageBucket: "savdo-f67f0.firebasestorage.app",
    messagingSenderId: "56810111219",
    appId: "1:56810111219:web:9a2d2492c91d179a0a7786",
    measurementId: "G-V5X9PN1CKK"
  };

  const app = initializeApp(firebaseConfig);
  const firestore = getFirestore(app);

  // Expose global app state & firebase functions for UI interaction
  window.DB_CLOUD = firestore;
  window.FB_OPS = { collection, doc, setDoc, deleteDoc, onSnapshot };
  window.initCloudSync();
</script>

<style>
:root{--bg:#f4f7f9;--card:#fff;--tx:#14262e;--mu:#5d7380;--pr:#0a7f8c;--bd:#d9e3e8;--rd:#c62828;--or:#e08a00;--gr:#2e7d32;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181c;--card:#18242a;--tx:#e6eef1;--mu:#8fa6b1;--pr:#37b6c4;--bd:#2a3b43;--rd:#ef6b6b;--or:#f0a93a;--gr:#6cc070}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:70px}
header{padding:14px 16px;font-weight:700;font-size:17px}
main{padding:0 12px 12px;max-width:900px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat b{display:block;font-size:19px}.stat span{color:var(--mu);font-size:12px}
input,select,button{font:inherit;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);width:100%;margin:3px 0}
button{background:var(--pr);color:#fff;border:0;font-weight:600;cursor:pointer}
button.s{background:transparent;color:var(--pr);border:1px solid var(--pr)}
button.d{background:var(--rd)}
.row{display:flex;gap:6px}.row>*{flex:1}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{background:none;color:var(--mu);border:0;border-radius:0;font-size:11px;padding:10px 2px;margin:0}
nav button.on{color:var(--pr);border-top:2px solid var(--pr)}
.it{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.it:last-child{border:0}.mu{color:var(--mu);font-size:12px}
.tag{font-size:11px;padding:2px 6px;border-radius:6px;color:#fff}
.r{background:var(--rd)}.o{background:var(--or)}.g{background:var(--gr)}
h3{margin:4px 0 8px;font-size:15px}
#inv{display:none;position:fixed;inset:0;background:var(--bg);overflow:auto;padding:16px;z-index:9}
#inv.on{display:block}
table{width:100%;border-collapse:collapse;font-size:13px;display:block;overflow-x:auto}
td,th{border-bottom:1px solid var(--bd);padding:5px;text-align:left}
@media print{body>*:not(#inv){display:none!important}#inv{position:static;color:#000;background:#fff}.np{display:none}}
</style>

<body>
<script>function showErr(m){var d=document.createElement('pre');d.style.cssText='white-space:pre-wrap;color:#c62828;padding:12px;font-size:12px;margin:0';d.textContent='Хато: '+m;document.body.appendChild(d)}window.onerror=function(m,u,l){showErr(m+' (сатр '+l+')')};window.onunhandledrejection=function(e){showErr(String(e.reason))};</script>
<header>🩺 Тиббий буюмлар савдоси МЧЖ <span id="sy" class="mu" style="font-weight:400">⏳ уланяпти…</span></header>
<main id="app"><div class="card">Юкланмоқда… Агар шу ёзув туриб қолса, интернет ёки уланишда муаммо бор.</div></main>
<div id="inv"></div>
<nav id="nav"></nav>

<script>
var KEY="tibbiy_v1",tab="home",cart=[],db={p:[],c:[],s:[],pay:[]};
try{var x=localStorage.getItem(KEY);if(x)db=JSON.parse(x)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
db.k=db.k||{};db.l=db.l||[];var ADM=true,mig={};

function putK(id,c){db.k[id]=c;save();if(window.DB_CLOUD){var op=window.FB_OPS;op.setDoc(op.doc(window.DB_CLOUD,"k",id),{id:id,cost:c}).catch(function(){})}}
function put(col,rec){save();if(window.DB_CLOUD){var op=window.FB_OPS;op.setDoc(op.doc(window.DB_CLOUD,col,rec.id),rec).catch(function(){$("sy").textContent="⚠️ синхронда хато"})}}

window.initCloudSync = function(){
 try{
  var op=window.FB_OPS, dbC=window.DB_CLOUD;
  $("sy").textContent="☁️ жонли синхрон · раҳбар";
  
  op.onSnapshot(op.doc(dbC,"k","_init_"),function(){},function(){}); // keepalive
  op.onSnapshot(op.collection(dbC,"k"),function(sn){db.k={};sn.docs.forEach(function(x){var q=x.data();if(q.id&&q.cost!=null)db.k[q.id]=q.cost});save();renderCheck();},function(){});

  ["p","c","s","pay","l"].forEach(function(col){
   op.onSnapshot(op.collection(dbC,col),function(sn){
    if(sn.empty&&db[col].length&&!mig[col]){mig[col]=1;db[col].forEach(function(r){op.setDoc(op.doc(dbC,col,r.id),r).catch(function(){})});return}
    mig[col]=1;db[col]=sn.docs.map(function(x){return x.data()});
    if(col=="s")db.s.sort(function(a,b){return(a.ts||0)-(b.ts||0)});
    save();renderCheck();
   },function(){})
  });
 }catch(e){$("sy").textContent="📴 офлайн режим"}
};

function renderCheck(){var a=document.activeElement;if(!a||(a.tagName!="INPUT"&&a.tagName!="SELECT"))render()}
function setK(id){var c=+prompt("Кирим нархи (1 дона учун)");if(c>=0){putK(id,c);render()}}
function $(i){return document.getElementById(i)}
function v(i){return $(i).value}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function m(n){return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g," ")+" сўм"}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function today(){return new Date().toISOString().slice(0,10)}
function days(d){return Math.round((new Date(d)-new Date(today()))/864e5)}
function expTag(e){var d=days(e);if(d<0)return'<span class="tag r">Муддати ўтган</span>';if(d<=90)return'<span class="tag o">Қолди: '+d+' кун</span>';return'<span class="tag g">'+e+'</span>'}
function P(id){return db.p.find(function(a){return a.id==id})}
function C(id){return db.c.find(function(a){return a.id==id})}
function paid(s){return s.paid+db.pay.filter(function(p){return p.sid==s.id}).reduce(function(a,p){return a+p.amt},0)}
function debt(s){return s.total-paid(s)}
function cdebt(cid){return db.s.filter(function(s){return s.cid==cid}).reduce(function(a,s){return a+debt(s)},0)}
var tabs=[["home","📊","Асосий"],["stock","📦","Омбор"],["sell","🛒","Сотув"],["debt","💳","Насия"],["cli","👥","Мижоз"],["docs","🧾","Ҳужжат"]];
function nav(){$("nav").innerHTML=tabs.map(function(t){return'<button class="'+(tab==t[0]?"on":"")+'" onclick="go(\''+t[0]+'\')">'+t[1]+"<br>"+t[2]+"</button>"}).join("")}
function go(t){tab=t;render()}
function render(){nav();var h="";if(tab=="home")h=home();if(tab=="stock")h=stock();if(tab=="sell")h=sell();if(tab=="debt")h=debts();if(tab=="cli")h=cli();if(tab=="docs")h=docs();$("app").innerHTML=h}

function home(){
 var val=db.p.reduce(function(a,p){return a+p.qty*p.price},0),dt=db.s.reduce(function(a,s){return a+debt(s)},0);
 var td=db.s.filter(function(s){return s.date==today()}).reduce(function(a,s){return a+s.total},0);
 var ex=db.p.filter(function(p){return p.qty>0&&days(p.exp)<=90});
 var low=db.p.filter(function(p){return p.qty>0&&p.qty<=5});
 return'<div class="grid"><div class="card stat"><b>'+m(td)+'</b><span>Бугунги сотув</span></div><div class="card stat"><b>'+m(dt)+'</b><span>Умумий қарз</span></div><div class="card stat"><b>'+m(val)+'</b><span>Омбор қиймати</span></div><div class="card stat"><b>'+db.s.length+'</b><span>Жами сотув</span></div></div>'+
 '<div class="card"><h3>⚠️ Яроқлилик муддати (90 кун)</h3>'+(ex.length?ex.map(function(p){return'<div class="it"><div>'+esc(p.name)+'<div class="mu">серия '+esc(p.batch)+' · қолдиқ '+p.qty+'</div></div>'+expTag(p.exp)+"</div>"}).join(""):'<div class="mu">Муаммо йўқ</div>')+'</div>'+
 '<div class="card"><h3>📉 Қолдиқ кам (≤5)</h3>'+(low.length?low.map(function(p){return'<div class="it"><div>'+esc(p.name)+'</div><b>'+p.qty+'</b></div>'}).join(""):'<div class="mu">Муаммо йўқ</div>')+'</div>'}

function stock(){
 var l=db.p.slice().sort(function(a,b){return a.exp<b.exp?-1:1});
 return'<div class="card"><h3>Янги товар кирими</h3><input id="pn" placeholder="Номи (масалан, шприц 5 мл)"><div class="row"><input id="pb" placeholder="Серия/партия №"><input id="pr" placeholder="Рўйхатдан ўтиш/сертификат №"></div><div class="row"><input id="pe" type="date" title="Яроқлилик муддати"><input id="pq" type="number" placeholder="Миқдор"></div><div class="row"><input id="pc" type="number" placeholder="Кирим нархи"><input id="pp" type="number" placeholder="Сотув нархи"></div><button onclick="addP()">Қўшиш</button></div>'+
 '<input id="q" placeholder="🔍 Қидириш" oninput="filt()"><div class="card" id="pl">'+plist(l)+'</div>'}

function edP(id){var p=P(id);$("inv").innerHTML='<div class="card"><h3>Товарни тузатиш</h3><input id="en" value="'+esc(p.name)+'"><div class="row"><input id="eb" value="'+esc(p.batch)+'" placeholder="Серия"><input id="er" value="'+esc(p.reg||"")+'" placeholder="Рег. №"></div><div class="row"><input id="ee" type="date" value="'+esc(p.exp)+'"><input id="eq" type="number" value="'+p.qty+'" placeholder="Миқдор"></div><input id="ep" type="number" value="'+p.price+'" placeholder="Сотув нархи"><input id="ec" type="number" value="'+(db.k[id]||0)+'" placeholder="Кирим нархи"><button onclick="saveP(\''+id+'\')">Сақлаш</button><button class="d" onclick="delP(\''+id+'\')">Ўчириш</button><button class="s" onclick="$(\'inv\').className=\'\'">Бекор қилиш</button></div>';$("inv").className="on"}
function saveP(id){var p=P(id),q=+v("eq"),pp=+v("ep");if(!v("en").trim()||!v("ee")||!(q>=0)||!(pp>0))return alert("Маълумотни тўғри киритинг");
 if(q!=p.qty){var lg={id:uid(),ts:Date.now(),date:today(),pid:id,name:p.name,old:p.qty,nw:q};db.l.push(lg);put("l",lg)}
 p.name=v("en").trim();p.batch=v("eb");p.reg=v("er");p.exp=v("ee");p.qty=q;p.price=pp;put("p",p);
 if($("ec")&&(+v("ec")||0)!=(db.k[id]||0))putK(id,+v("ec")||0);
 $("inv").className="";render()}
function delP(id){if(db.s.some(function(s){return s.items.some(function(i){return i.pid==id})}))return alert("Бу товар сотувларда қатнашган, ўчириб бўлмайди. Миқдорини 0 қилинг.");
 if(!confirm("Бу товарни ўчирасизми?"))return;db.p=db.p.filter(function(x){return x.id!=id});delete db.k[id];save();
 if(window.DB_CLOUD){var op=window.FB_OPS,dbC=window.DB_CLOUD;op.deleteDoc(op.doc(dbC,"p",id)).catch(function(){});op.deleteDoc(op.doc(dbC,"k",id)).catch(function(){})}
 $("inv").className="";render()}
function plist(l){return l.length?l.map(function(p){return'<div class="it"><div><b>'+esc(p.name)+'</b><div class="mu">серия '+esc(p.batch)+' · рег. '+esc(p.reg||"—")+'</div><div class="mu">сотув '+m(p.price)+' · '+expTag(p.exp)+'</div></div><div style="text-align:right"><b>'+p.qty+'</b><br><button class="s" onclick="plus(\''+p.id+'\')">+ кирим</button><button class="s" onclick="edP(\''+p.id+'\')">✏️ тузатиш</button><button class="s" onclick="setK(\''+p.id+'\')">кирим нархи: '+m(db.k[p.id]||0)+'</button></div></div>'}).join(""):'<div class="mu">Товар йўқ</div>'}
function filt(){var q=v("q").toLowerCase();$("pl").innerHTML=plist(db.p.filter(function(p){return(p.name+p.batch+p.reg).toLowerCase().indexOf(q)>=0}))}
function addP(){var n=v("pn").trim(),q=+v("pq"),pp=+v("pp"),pc=+v("pc");if(!n||!v("pe")||!q||!pp)return alert("Номи, муддат, миқдор ва сотув нархини киритинг");
 var np={id:uid(),name:n,batch:v("pb"),reg:v("pr"),exp:v("pe"),qty:q,price:pp};db.p.push(np);put("p",np);if(pc)putK(np.id,pc);render()}
function plus(id){var q=+prompt("Қанча миқдор кирим қилинади?");if(q>0){P(id).qty+=q;put("p",P(id));render()} }

function sell(){
 var av=db.p.filter(function(p){return p.qty>0&&days(p.exp)>=0}).sort(function(a,b){return a.exp<b.exp?-1:1});
 var tot=cart.reduce(function(a,i){return a+i.qty*i.price},0);
 return'<div class="card"><h3>Сотув</h3><select id="sp">'+av.map(function(p){return'<option value="'+p.id+'">'+esc(p.name)+' · '+esc(p.batch)+' · '+p.exp+' ('+p.qty+' дона) — '+m(p.price)+'</option>'}).join("")+'</select><div class="row"><input id="sq" type="number" placeholder="Миқдор"><button onclick="addC()">Қўшиш</button></div>'+
 cart.map(function(i,k){return'<div class="it"><div>'+esc(P(i.pid).name)+' × '+i.qty+'</div><div>'+m(i.qty*i.price)+' <button class="d" style="width:auto" onclick="cart.splice('+k+',1);render()">✕</button></div></div>'}).join("")+
 '<h3>Жами: '+m(tot)+'</h3><select id="sc"><option value="">— Мижоз (нақд савдода шарт эмас) —</option>'+db.c.map(function(c){return'<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join("")+'</select><input id="sd" type="number" placeholder="Ҳозир тўланган сумма (қолгани насия)" value="'+tot+'"><button onclick="doSale()">Сотишни расмийлаштириш</button></div>'+
 '<div class="card"><h3>Охирги сотувлар</h3>'+db.s.slice(-8).reverse().map(function(s){return'<div class="it" onclick="inv(\''+s.id+'\')"><div>№'+s.no+' · '+(s.cid?esc(C(s.cid).name):"Нақд мижоз")+'<div class="mu">'+s.date+'</div></div><div>'+m(s.total)+(debt(s)>0?'<br><span class="tag r">қарз '+m(debt(s))+'</span>':'')+'</div></div>'}).join("")+'</div>'}
function addC(){var p=P(v("sp")),q=+v("sq");if(!p||q<=0)return;var ex=cart.filter(function(i){return i.pid==p.id})[0],have=(ex?ex.qty:0)+q;if(have>p.qty)return alert("Омборда фақат "+p.qty+" дона бор");if(ex)ex.qty=have;else cart.push({pid:p.id,qty:q,price:p.price});render()}
function doSale(){if(!cart.length)return alert("Савдо рўйхати бўш");var tot=cart.reduce(function(a,i){return a+i.qty*i.price},0),pd=Math.min(+v("sd")||0,tot),cid=v("sc");
 if(pd<tot&&!cid)return alert("Насия савдо учун мижозни танланг");
 cart.forEach(function(i){P(i.pid).qty-=i.qty;put("p",P(i.pid))});
 var s={id:uid(),no:db.s.length+1,date:today(),cid:cid,items:cart.map(function(i){return{pid:i.pid,qty:i.qty,price:i.price}}),total:tot,paid:pd,ts:Date.now()};
 db.s.push(s);put("s",s);cart=[];render();inv(s.id)}

function debts(){
 var l=db.s.filter(function(s){return debt(s)>0});
 return'<div class="card"><h3>Насия ҳисоби</h3>'+(l.length?l.map(function(s){var late=days(s.date)<-30;return'<div class="it"><div><b>'+esc(s.cid?C(s.cid).name:"—")+'</b><div class="mu">Ҳисоб №'+s.no+' · '+s.date+' · жами '+m(s.total)+'</div>'+(late?'<span class="tag r">30 кундан ошди</span>':'')+'</div><div style="text-align:right"><b>'+m(debt(s))+'</b><br><button class="s" onclick="payD(\''+s.id+'\')">Тўлов</button></div></div>'}).join(""):'<div class="mu">Қарздорлик йўқ 🎉</div>')+'</div>'}
function payD(id){var s=db.s.filter(function(a){return a.id==id})[0],a=+prompt("Тўлов суммаси (қарз: "+m(debt(s))+")");if(a>0){var pr={id:uid(),sid:id,amt:Math.min(a,debt(s)),date:today()};db.pay.push(pr);put("pay",pr);render()}}

function cli(){
 return'<div class="card"><h3>Янги мижоз</h3><input id="cn" placeholder="Клиника/дорихона номи"><div class="row"><input id="ci" placeholder="СТИР (ИНН)"><input id="ct" placeholder="Телефон"></div><button onclick="addCl()">Қўшиш</button></div><div class="card">'+
 (db.c.length?db.c.map(function(c){var d=cdebt(c.id);return'<div class="it"><div><b>'+esc(c.name)+'</b><div class="mu">'+esc(c.inn||"")+' '+esc(c.tel||"")+'</div></div><div>'+(d>0?'<span class="tag r">'+m(d)+'</span>':'<span class="tag g">қарз йўқ</span>')+'</div></div>'}).join(""):'<div class="mu">Мижоз йўқ</div>')+'</div>'}
function addCl(){if(!v("cn").trim())return;var nc={id:uid(),name:v("cn").trim(),inn:v("ci"),tel:v("ct")};db.c.push(nc);put("c",nc);render()}

function docs(){
 var rev=db.s.reduce(function(a,s){return a+s.total},0),prof=db.s.reduce(function(a,s){return a+s.items.reduce(function(b,i){return b+i.qty*(i.price-(db.k[i.pid]||0))},0)},0);
 return'<div class="card"><h3>Ҳисобот</h3><div class="it"><span>Умумий савдо</span><b>'+m(rev)+'</b></div><div class="it"><span>Тахминий фойда</span><b>'+m(prof)+'</b></div><div class="it"><span>Олинган тўловлар</span><b>'+m(db.s.reduce(function(a,s){return a+paid(s)},0))+'</b></div></div>'+
 '<div class="card"><h3>✏️ Миқдор тузатишлари</h3>'+(db.l.length?db.l.slice(-8).reverse().map(function(g){return'<div class="it"><div>'+esc(g.name)+'<div class="mu">'+g.date+'</div></div><div>'+g.old+' → <b>'+g.nw+'</b></div></div>'}).join(""):'<div class="mu">Тузатиш бўлмаган</div>')+'</div>'+'<div class="card"><h3>Ҳисоб-фактура / юк хати</h3>'+db.s.slice().reverse().map(function(s){return'<div class="it" onclick="inv(\''+s.id+'\')"><div>№'+s.no+' · '+s.date+'<div class="mu">'+(s.cid?esc(C(s.cid).name):"Нақд мижоз")+'</div></div><div>'+m(s.total)+' 🖨</div></div>'}).join("")+'</div>'}
function inv(id){var s=db.s.filter(function(a){return a.id==id})[0],c=s.cid?C(s.cid):null;
 $("inv").innerHTML='<div class="np row"><button onclick="window.print()">🖨 Чоп этиш</button><button class="s" onclick="$(\'inv\').className=\'\'">Ёпиш</button></div><h2>Ҳисоб-фактура / юк хати №'+s.no+'</h2><p>Сана: '+s.date+'<br>Сотувчи: Тиббий буюмлар савдоси МЧЖ<br>Харидор: '+(c?esc(c.name)+' (СТИР: '+esc(c.inn||"—")+')':"Нақд мижоз")+'</p><table><tr><th>Номи</th><th>Серия</th><th>Муддат</th><th>Сони</th><th>Нархи</th><th>Сумма</th></tr>'+
